<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zennia</title>
    <!-- sets the theme before first paint so a saved choice does not flash the other one; mirrors resolveTheme in src/data/theme.ts -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('zennia:theme'))
        var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('link[rel="icon"]').href = dark ? '/favicon-dark.png' : '/favicon.png'
      } catch (e) {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
